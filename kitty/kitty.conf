# ============================================================
#            👾 KITTY — ARCADE // DOOM
#   Flat, solid, no glass. A CRT tube, not a phone screen.
# ============================================================

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 12.0

window_padding_width 8
background_opacity 1.0
hide_window_decorations yes
confirm_os_window_close 0

cursor_shape block
cursor_blink_interval 0.4

cursor #FF2A2A
cursor_text_color #0A0A0A

background #0A0A0A
foreground #E8E8E8

selection_foreground #0A0A0A
selection_background #39FF14

# Black
color0  #0A0A0A
color8  #333333

# Fire red
color1  #FF2A2A
color9  #FF6A45

# Phosphor green
color2  #39FF14
color10 #6BFF4D

# Sulfur yellow
color3  #FFD500
color11 #FFEA70

# Coin-slot blue / cyan
color4  #00E5FF
color12 #6FF3FF

# Arcade magenta
color5  #FF00FF
color13 #FF66FF

# Cyan
color6  #00E5FF
color14 #7FFFFF

# Bone / white
color7  #E8E8E8
color15 #FFFFFF
