#############################################
#      👾 ARCADE // DOOM — PICOM
#  Flat 2D cabinet look: no blur, no rounding.
#############################################

backend = "glx";
vsync = true;

#############################################
# SHADOWS — off, keep it flat like a sprite
#############################################

shadow = false;

#############################################
# CORNERS
#############################################

corner-radius = 0;

#############################################
# FADING
#############################################

fading = false;

#############################################
# BLUR
#############################################

blur-background = false;

#############################################
# OPACITY — fully solid, CRT tubes don't do glass
#############################################

inactive-opacity = 1.00;
active-opacity = 1.00;
frame-opacity = 1.00;

#############################################
# GENERAL
#############################################

mark-wmwin-focused = true;
mark-ovredir-focused = true;
use-damage = true;
